# Production local /home backup configuration. This file contains no secrets.
SOURCE=/home/jack
RESTIC_REPOSITORY=/var/lib/restic/home
EXPECTED_REPOSITORY_ID=fad9e4c059250bf3d0d22ab90018ba599d09b57deaed944c4e0b1277c7c81dac
# Uses jack's existing GPG agent; locked/expired agent fails without prompting.
RESTIC_PASSWORD_COMMAND=/usr/local/sbin/restic-home-password
RECOVERY_CONFIRMATION_FILE=/etc/restic/home.password.bitwarden-confirmed
LOG_DIR=/var/log/restic-home
LOG_RETENTION_DAYS=30
STAGING_DIR=/var/lib/restic/staging
RESTIC_CACHE_DIR=/var/cache/restic-home
SOURCE_BASELINE_FILE=/var/lib/restic/home-source-baseline
INCIDENT_HOLD_FILE=/var/lib/restic/home-retention.hold
BACKUP_HOST=Debian4

EXPECTED_UID=1000
EXPECTED_GID=1000

# Absolute corruption guards plus a one-time, non-decreasing enrollment baseline.
# The selected Debian4 snapshot contained 8,955,164,790 bytes and 85,678 files.
MIN_BYTES=500000000
MIN_FILES=10000
MIN_SESSIONS=100
MIN_BASELINE_BYTES_PERCENT=80
MIN_BASELINE_FILES_PERCENT=80
MIN_BASELINE_SESSIONS_PERCENT=80
# Status fails after two missed 15-minute snapshot opportunities.
MAX_SNAPSHOT_AGE_SECONDS=1800

MCFLY_DATABASE=.local/share/mcfly/history.db
MCFLY_RECOVERY_COPY=.local/share/mcfly/history.db.restic-backup

REQUIRED_LANDMARKS=(
  .pi/agent/sessions
  .local/share/chezmoi
  .ssh/id_ed25519
  git/dotfiles/.git
  "$MCFLY_DATABASE"
)
