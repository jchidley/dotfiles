# Production local /home backup configuration. This file contains no secrets.
SOURCE=/home/jack
RESTIC_REPOSITORY=/var/lib/restic/home
RESTIC_PASSWORD_FILE=/etc/restic/home.password
RECOVERY_CONFIRMATION_FILE=/etc/restic/home.password.bitwarden-confirmed
LOG_DIR=/var/log/restic-home
LOG_RETENTION_DAYS=30
STAGING_DIR=/var/lib/restic/staging
RESTIC_CACHE_DIR=/var/cache/restic-home
BACKUP_HOST=Debian-Recovered

EXPECTED_UID=1000
EXPECTED_GID=1000

# Conservative deletion guards, well below the observed 2.49 GB / 49,383 files.
MIN_BYTES=500000000
MIN_FILES=10000
MIN_SESSIONS=100

MCFLY_DATABASE=.local/share/mcfly/history.db
MCFLY_RECOVERY_COPY=.local/share/mcfly/history.db.restic-backup

REQUIRED_LANDMARKS=(
  .pi/agent/sessions
  .local/share/chezmoi
  .ssh/id_ed25519
  boat-data-platform/.git
  "$MCFLY_DATABASE"
)
